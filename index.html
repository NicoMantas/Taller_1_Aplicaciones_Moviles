<!DOCTYPE html>
<html lang = "es">
    <head>
        <meta charset = "UTF-8">
        <title>
            Stardew Valley for Nintendo Switch
        </title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href = "styles.css">
    </head>

    <body>
        <!-- HEADER -->
        <header class="main-header">
        <div class="header-container">
        
            <!-- Logo -->
        <div class="logo">
                Nintendo
        </div>
        
            <!-- Navigation -->
        <nav class="nav">
        <ul class="nav-list">
        <li class="nav-item dropdown">
        <a href="#">Games</a>
        <ul class="dropdown-menu">
        <li><a href="#">Nintendo Switch</a></li>
        <li><a href="#">PC</a></li>
        <li><a href="#">Mobile</a></li>
        </ul>
        </li>
        
                <li class="nav-item dropdown">
        <a href="#">Nintendo Switch</a>
        <ul class="dropdown-menu">
        <li><a href="#">Consoles</a></li>
        <li><a href="#">Accessories</a></li>
        </ul>
        </li>
        
                <li class="nav-item">
        <a href="#">News & Events</a>
        </li>
        </ul>
        </nav>
        
            <!-- Actions -->
        <div class="header-actions">
        <a href="#">Support</a>
        <a href="#">Wishlist</a>
        <a href="#">Cart</a>
        </div>
        
            </div>
        </header>
        <main class="main-content">
    
            <section class="hero">
            <div class="hero-container">
            
                <!-- Imagen del juego -->
            <div class="hero-image">
            <img src="https://via.placeholder.com/500x300" alt="Stardew Valley">
            </div>
            
                <!-- Información -->
            <div class="hero-info">
            <span class="platform">Nintendo Switch</span>
            <h1>Stardew Valley</h1>
            <p class="price">$14.99</p>
            
                    <button class="buy-btn">
                    Direct download
            </button>
            </div>
            
                </div>
            </section>
            <section class="gallery">
<div class="gallery-container">
 
    <button class="gallery-btn prev">‹</button>
 
    <div class="gallery-track">
<img src="assets/Stardew_Valley_image1.avif">
<img src="assets/Stardew_Valley_image2.avif">
<img src="assets/Stardew_Valley_image3.avif">
<img src="assets/Stardew_Valley_image4.avif">
<img src="assets/Stardew_Valley_image5.avif">
<img src="assets/Stardew_Valley_image6.avif">
<img src="assets/Stardew_Valley_image7.avif">
</div>
 
    <button class="gallery-btn next">›</button>
 
  </div>
</section>

        </main>
        
        <!-- FOOTER -->
        <footer class="main-footer">
        <div class="footer-container">
        <p>© Nintendo.</p>
        </div>
        </footer>
        
        <script src="script.js"></script>

        <div class="lightbox" id="lightbox">
<img id="lightbox-img">
</div>
    </body>

</html>
