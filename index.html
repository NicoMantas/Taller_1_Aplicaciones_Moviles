<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>
        Stardew Valley for Nintendo Switch
    </title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <!-- HEADER -->
    <header class="main-header">
        <div class="header-container">

            <!-- Logo -->
            <div class="logo">
                Nintendo
            </div>

            <!-- Navigation -->
            <nav class="nav">
                <ul class="nav-list">
                    <li class="nav-item dropdown">
                        <a href="#">Games</a>
                        <ul class="dropdown-menu">
                            <li><a href="#">Nintendo Switch</a></li>
                            <li><a href="#">PC</a></li>
                            <li><a href="#">Mobile</a></li>
                        </ul>
                    </li>

                    <li class="nav-item dropdown">
                        <a href="#">Nintendo Switch</a>
                        <ul class="dropdown-menu">
                            <li><a href="#">Consoles</a></li>
                            <li><a href="#">Accessories</a></li>
                        </ul>
                    </li>

                    <li class="nav-item">
                        <a href="#">News & Events</a>
                    </li>
                </ul>
            </nav>

            <!-- Actions -->
            <div class="header-actions">
                <a href="#">Support</a>
                <a href="#">Wishlist</a>
                <a href="#">Cart</a>
            </div>

        </div>
    </header>
    <main class="main-content">

        <section class="hero">
            <div class="hero-container">

                <!-- Carrusel de imágenes -->
                <div class="hero-carousel">
                    <div class="carousel-viewport">
                        <div class="carousel-track">
                            <img src="assets/Stardew_Valley_image1.avif" alt="Stardew Valley 1">
                            <img src="assets/Stardew_Valley_image2.avif" alt="Stardew Valley 2">
                            <img src="assets/Stardew_Valley_image3.avif" alt="Stardew Valley 3">
                            <img src="assets/Stardew_Valley_image4.avif" alt="Stardew Valley 4">
                            <img src="assets/Stardew_Valley_image5.avif" alt="Stardew Valley 5">
                            <img src="assets/Stardew_Valley_image6.avif" alt="Stardew Valley 6">
                            <img src="assets/Stardew_Valley_image7.avif" alt="Stardew Valley 7">
                        </div>
                    </div>
                    <div class="carousel-controls">
                        <button type="button" class="carousel-btn carousel-prev" aria-label="Anterior">‹</button>
                        <div class="carousel-dots"></div>
                        <button type="button" class="carousel-btn carousel-next" aria-label="Siguiente">›</button>
                    </div>
                </div>

                <!-- Información -->
                <div class="hero-info">
                    <span class="platform">Nintendo Switch</span>
                    <h1>Stardew Valley</h1>
                    <p class="price">$14.99</p>

                    <button class="buy-btn">
                        Direct download
                    </button>
                </div>

            </div>
        </section>

    </main>

    <!-- FOOTER -->
    <footer class="main-footer">
        <div class="footer-container">
            <p>© Nintendo.</p>
        </div>
    </footer>

    <div class="lightbox" id="lightbox">
        <img id="lightbox-img" alt="Vista ampliada">
    </div>

    <script src="script.js"></script>
</body>

</html>
