<head>
    <title>Teclado Virtual</title>
    <link rel="stylesheet" href="styles.css">
</head>

<section class="caja_clave">
    <input type="password" placeholder="Clave acá" class="clave">
    <p id="mensaje"></p>



    <section id="teclado">
        <input type="button" value="1" class="tecla" data-num="1">
        <input type="button" value="2" class="tecla" data-num="2">
        <input type="button" value="3" class="tecla" data-num="3">
        <input type="button" value="4" class="tecla" data-num="4">
        <input type="button" value="5" class="tecla" data-num="5">
        <input type="button" value="6" class="tecla" data-num="6">
        <input type="button" value="7" class="tecla" data-num="7">
        <input type="button" value="8" class="tecla" data-num="8">
        <input type="button" value="9" class="tecla" data-num="9">
        <input type="button" value="0" class="tecla" data-num="0">
        <input type="button" value="Borrar" class="tecla borrar">
    </section>

    <input type="button" value="Aceptar" class="tecla aceptar">



    <script src="script.js"></script>

</section>
